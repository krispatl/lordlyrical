<!doctype html><meta charset="utf-8"><title>Lord Lyrical • Show Control</title>
<style>body{background:#0c1019;color:#e5ecf4;font:16px system-ui;max-width:1150px;margin:40px auto}h1{letter-spacing:.15em;font-size:24px}small{color:#8093ad}button,select,input{background:#192637;border:1px solid #40516c;color:#fff;padding:12px;margin:5px;border-radius:7px}button:hover{background:#2d4360}#state{font-size:46px;color:#80e6da}table{width:100%;border-collapse:collapse;margin-top:24px}td,th{text-align:left;padding:10px;border-bottom:1px solid #24344a}#error{color:#ff938e}.meter{display:flex;justify-content:space-between;padding:24px;background:#121b29;border-radius:12px}.muted{color:#708499}</style>
<h1>LORD LYRICAL <small>THE RESONANT REALM</small></h1><p>VENUE SHOW CONTROL · STYLY NETSYNC 0.17.4 · 121 SECONDS</p>
<div class="meter"><span id="state">Connecting</span><span><b id="time">0:00</b><p id="health"></p></span></div>
<p><button onclick="cmd('start')">Arm & start countdown</button><button onclick="cmd('reset')">Reset show</button><button onclick="cmd('force_start')">Force start (cast gate applies)</button><select id="mode" onchange="cmd('mode',this.value)"><option>Adaptive</option><option>FullCast</option></select><button onclick="cmd('release_absent')">Release absent slots</button></p>
<details><summary>Developer timeline scrubber</summary><p id="seek"></p><small>Seeking changes the shared epoch for every headset. Use for rehearsal.</small></details><p id="error"></p>
<table><thead><tr><th>Slot / key</th><th>Connection</th><th>Device / client</th><th>FPS</th><th>Audio drift</th><th>Clock RTT</th><th>Battery</th><th>Memory</th><th>Phase / cue</th><th>Health</th></tr></thead><tbody id="roster"></tbody></table>
<script>
const $=id=>document.getElementById(id);for(const t of [0,21,26,39,59,63,69,81,90,98,111]){const b=document.createElement('button');b.textContent=t+' s';b.onclick=()=>cmd('seek',t);$('seek').append(b)}
async function cmd(command,value){const r=await fetch('/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command,value})});const d=await r.json();$('error').textContent=d.error||''}
async function poll(){try{const d=await(await fetch('/status')).json();$('state').textContent=d.phase+(d.phase==='Countdown'?' '+d.countdown.toFixed(1):'');$('time').textContent=Math.floor(d.time/60)+':'+String(Math.floor(d.time%60)).padStart(2,'0');$('health').textContent=(d.connected?'Server connected':'Server disconnected')+' · '+d.room;$('mode').value=d.mode;$('error').textContent=d.error;$('roster').replaceChildren();for(const p of d.participants){const v=d.telemetry[p.clientNo]||{};const tr=document.createElement('tr');for(const x of [(p.slot+1)+' / '+p.key,p.connected?'Connected':'Spectral / absent',(p.deviceId||'Unassigned')+' / '+p.clientNo,v.fps?.toFixed(1)||'—',Number.isFinite(v.driftMs)?v.driftMs.toFixed(1)+' ms':'—',Number.isFinite(v.rttMs)?v.rttMs.toFixed(1)+' ms':'—',v.battery>=0?Math.round(v.battery*100)+'%':'—',Number.isFinite(v.memoryMb)?v.memoryMb.toFixed(0)+' MB':'—',(v.phase||'—')+' / '+(v.cue||'—'),v.error||(p.connected?'OK':'—')]){const td=document.createElement('td');td.textContent=x;tr.append(td)}$('roster').append(tr)}}catch(e){$('health').textContent='Authority unavailable'}setTimeout(poll,500)}poll();
</script>
